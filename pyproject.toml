[project]
name = "neuron-reflection"
version = "0.1.0"
description = "Reflecting, projecting and mapping Qwen3-8B's MLP neurons and attention heads along contrast axes to swap, fuse, remove or split a concept."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "mx@a9l.im" }, { name = "treetowntree" }]
keywords = ["mechanistic interpretability", "weight editing", "neurons", "attention heads", "Qwen3-8B"]
# neuron-lens is not on PyPI; install it from GitHub first (README, Setup).
dependencies = [
    "neuron-lens>=0.1",
    "scipy>=1.11",
    "torch>=2.8",
    "transformers>=5",
]

[project.optional-dependencies]
# Figures for docs/ (scripts/figures.py); scripts/graphics.py also needs a headless Chrome.
figures = ["matplotlib>=3.8"]
# The offline unit tests (tests/).
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/stdlogits/neuron-reflection"
"neuron-lens" = "https://github.com/stdlogits/neuron-lens"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuron_reflection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
